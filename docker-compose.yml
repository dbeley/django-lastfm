services:
  web:
    container_name: lastfm_django
    build: .
    restart: always
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn lastfm_django.wsgi --bind 0.0.0.0:8000 --timeout 600"
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-change-me-in-production}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost 127.0.0.1}
      - PYLAST_USERNAME=${PYLAST_USERNAME:-}
      - PYLAST_API_KEY=${PYLAST_API_KEY:-}
      - PYLAST_API_SECRET=${PYLAST_API_SECRET:-}
    volumes:
      - sqlite_data:/code/db.sqlite3

volumes:
  sqlite_data:
